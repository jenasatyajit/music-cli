[project]
name = "tmusic"
version = "0.1.0"
description = "tmusic — terminal YouTube Music player (curses TUI, mpv audio)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ytmusicapi>=1.12,<2",
    "yt-dlp>=2026.1.1",
    "requests>=2.31",
    "pillow>=10.0",
    "windows-curses>=2.3.0; sys_platform == 'win32'",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[project.scripts]
tmusic = "tmusic.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tmusic"]

[tool.pytest.ini_options]
testpaths = ["tests"]